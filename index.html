<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой IP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
            background: #1d1d1d;
            border-radius: 20px;
        }

        button {
            padding: 14px 25px;
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        #ip {
            font-size: 28px;
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Ваш IP-адрес</h1>

    <div id="ip">Определяем...</div>

    <p>
        Нажимая кнопку, вы соглашаетесь на отображение
        вашего IP-адреса на этой странице.
    </p>
</div>

<script>
async function getIP() {
    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();

        document.getElementById("ip").textContent = data.ip;
    } catch (error) {
        document.getElementById("ip").textContent =
            "Не удалось определить IP";
    }
}

getIP();
</script>

</body>
</html>
